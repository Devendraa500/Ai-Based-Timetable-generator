<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI-powered intelligent timetable generator with conflict-free scheduling for classes, faculty, and rooms.">
    <title>{% block title %}smart timetable assistant{% endblock %}</title>

    <!-- Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- GSAP for animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    {% block head_extra %}{% endblock %}
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div class="nav-inner">
            <a href="/dashboard" class="nav-brand magnetic">
                <span class="brand-mark">TT</span>
                ai timetable®
            </a>

            <div class="nav-links">
                <a class="nav-link magnetic" href="/dashboard">dashboard</a>
                <a class="nav-link magnetic" href="/faculty">teachers</a>
                <a class="nav-link magnetic" href="/classes">classes</a>
                <a class="nav-link magnetic" href="/subjects">subjects</a>
                <a class="nav-link magnetic" href="/rooms">rooms</a>
                <a class="nav-link magnetic" href="/timetable">schedule</a>
                <a class="nav-link magnetic" href="/info">info</a>
            </div>

            <div class="nav-actions">
                <button id="themeToggleBtn" class="btn btn-sm magnetic" aria-label="Toggle theme">◑ light</button>
                <a href="/logout" class="btn btn-sm btn-danger magnetic">logout</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="app-container">
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="app-container">
            developed as part of learning at
            <a href="https://www.pce.ac.in/" target="_blank">pillai college of engineering (pce)</a>
            — ©2025
        </div>
    </footer>

    <!-- Animation Controller -->
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
