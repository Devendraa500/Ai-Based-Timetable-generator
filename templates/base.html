<!DOCTYPE html>
<html>
<head>
    <title>Smart Timetable Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f6ff;
            --panel: #ffffff;
            --text: #111827;
            --muted: #64748b;
            --brand: #4f46e5;
            --brand-soft: #eef2ff;
            --border: #e2e8f0;
        }
        body.dark {
            --bg: #0b1020;
            --panel: #111a2f;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --brand: #818cf8;
            --brand-soft: #1f2848;
            --border: #253252;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", sans-serif;
        }
        .brand {
            font-size: 44px;
            font-weight: 700;
            color: #111827;
        }
        body.dark .brand { color: #f9fafb; }
        .top-tab {
            display: inline-flex;
            text-decoration: none;
            color: var(--text);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 14px;
            font-weight: 600;
        }
        .top-tab:hover {
            background: var(--brand-soft);
            border-color: #c7d2fe;
        }
        .top-tab.active {
            background: var(--brand-soft);
            border-color: #c7d2fe;
            color: #3730a3;
        }
        body.dark .top-tab.active { color: #c7d2fe; }
        .content { padding: 0; }
        .surface-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }
        .card-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.05);
        }
        .muted { color: var(--muted); }
        .feature-card {
            height: 150px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .feature-icon {
            font-size: 30px;
            margin-bottom: 8px;
            display: block;
        }
        .status-strip {
            background: #ecfdf3;
            color: #065f46;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-weight: 600;
        }
        body.dark .status-strip {
            background: #10281d;
            color: #bbf7d0;
            border-color: #1d4f39;
        }
        .theme-toggle-btn {
            font-weight: 700;
            border-width: 1px;
        }
        body:not(.dark) .theme-toggle-btn {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }
        body.dark .theme-toggle-btn {
            background: #facc15;
            color: #111827;
            border-color: #facc15;
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.2);
        }
        .form-control::placeholder,
        .form-select.placeholder-option {
            color: #94a3b8;
        }
        @media (max-width: 900px) {
            .brand { font-size: 34px; }
        }
    </style>
</head>
<body>
<div class="container-fluid py-4">
    <div class="mx-auto" style="max-width:1240px;">
        <div class="text-center mb-4">
            <div class="brand">AI Timetable Generator</div>
            <div class="muted">Intelligent scheduling for year-wise and batch-wise timetables</div>
        </div>
        <div class="card-box mb-3 p-2">
            <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="d-flex flex-wrap gap-2">
                    <a class="top-tab" href="/dashboard">Dashboard</a>
                    <a class="top-tab" href="/faculty">Teachers</a>
                    <a class="top-tab" href="/classes">Classes & Batches</a>
                    <a class="top-tab" href="/subjects">Subjects</a>
                    <a class="top-tab" href="/rooms">Rooms</a>
                    <a class="top-tab" href="/timetable">Schedule</a>
                </div>
                <div class="d-flex gap-2">
                    <button id="themeToggleBtn" onclick="toggleDark()" class="btn btn-sm theme-toggle-btn" aria-label="Toggle theme">🌙 Dark Mode</button>
                    <a href="/logout" class="btn btn-sm btn-dark">Logout</a>
                </div>
            </div>
        </div>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script>
function syncThemeButton() {
    const isDark = document.body.classList.contains("dark");
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
}
function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    syncThemeButton();
}
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
syncThemeButton();
const currentPath = window.location.pathname;
document.querySelectorAll(".top-tab").forEach(tab => {
    if (tab.getAttribute("href") === currentPath) {
        tab.classList.add("active");
    }
});
</script>
</body>
</html>
