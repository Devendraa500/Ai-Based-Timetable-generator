{% extends "base.html" %}
{% block content %}
<h3 class="mb-1">Classes and Division Batches</h3>
<div class="muted mb-3">Add, edit, or delete class divisions and lab batches.</div>

<div class="row g-3">
    <div class="col-lg-6">
        <div class="card-box">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">Class Division</h5>
                <!--<span id="classModeBadge" class="badge text-bg-primary">New</span>-->
            </div>
            <input type="hidden" id="class_edit_id">
            <div class="row g-2 mb-2">
                <div class="col-md-4">
                    <label for="year" class="form-label small mb-0">Year</label>
                    <select id="year" class="form-select">
                        <option value="">Select year</option>
                        <option value="1">I</option>
                        <option value="2">II</option>
                        <option value="3">III</option>
                        <option value="4">IV</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="division" class="form-label small mb-0">Division</label>
                    <input id="division" class="form-control" placeholder="Division">
                </div>
                <div class="col-md-4">
                    <label for="strength" class="form-label small mb-0">Strength</label>
                    <input id="strength" type="number" min="1" class="form-control" value="60" placeholder="Strength">
                </div>
            </div>
            <select id="dept" class="form-select mb-3">
                <option value="">Select Department</option>
                <option value="CS">CS</option>
                <option value="IT">IT</option>
                <option value="ECS">ECS</option>
                <option value="AUTO">AUTO</option>
                <option value="MECH">MECH</option>
                <option value="EXTC">EXTC</option>
            </select>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" onclick="saveClass()">Save Class</button>
                <button class="btn btn-outline-secondary" onclick="resetClassForm()">Clear</button>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card-box">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">Batch</h5>
                <!--<span id="batchModeBadge" class="badge text-bg-primary">New</span>-->
            </div>
            <input type="hidden" id="batch_edit_id">
            <select id="class_id" class="form-select mb-2">
                <option value="">Select class division</option>
            </select>
            <div class="row g-2 mb-3">
                <div class="col-md-6"><input id="batch_name" class="form-control" placeholder="Batch name, e.g. B1"></div>
                <div class="col-md-6"><input id="batch_size" type="number" min="1" class="form-control" value="30" placeholder="Batch size"></div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary" onclick="saveBatch()">Save Batch</button>
                <button class="btn btn-outline-secondary" onclick="resetBatchForm()">Clear</button>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 mt-1">
    <div class="col-lg-6">
        <div class="card-box">
            <h5>Configured Classes</h5>
            <div id="list" class="mt-2"></div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card-box">
            <h5>Configured Batches</h5>
            <div id="batchList" class="mt-2"></div>
        </div>
    </div>
</div>

<script>
let classCache = [];
let batchCache = [];

const ROMAN = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' };
const FIXED_DEPTS = ['', 'CS', 'IT', 'ECS', 'AUTO', 'MECH', 'EXTC'];

function showError(err){ alert(err?.message || err || "Request failed."); }
async function postJSON(url, payload){
    const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify(payload)});
    const d = await r.json().catch(()=>({}));
    if(!r.ok || d.status === 'error'){ throw new Error(d.message || d.error || 'Request failed'); }
    return d;
}
function requireValue(id, label){
    const el = document.getElementById(id);
    const value = (el.value || '').trim();
    if(!value){ throw new Error(label + ' is required.'); }
    return value;
}
function resetClassForm(){
    document.getElementById('class_edit_id').value = '';
    document.getElementById('year').value = '';
    document.getElementById('division').value = '';
    document.getElementById('strength').value = '60';
    const deptSel = document.getElementById('dept');
    [...deptSel.options].forEach(o => { if (!FIXED_DEPTS.includes(o.value)) o.remove(); });
    deptSel.value = '';
    /**document.getElementById('classModeBadge').textContent = 'New';
    document.getElementById('classModeBadge').className = 'badge text-bg-primary';**/
}
function resetBatchForm(){
    document.getElementById('batch_edit_id').value = '';
    document.getElementById('class_id').value = '';
    document.getElementById('batch_name').value = '';
    document.getElementById('batch_size').value = '30';
    /**document.getElementById('batchModeBadge').textContent = 'New';
    document.getElementById('batchModeBadge').className = 'badge text-bg-primary';**/
}
async function saveClass(){
    try {
        const payload = {
            year: parseInt(requireValue('year','Year')),
            division: requireValue('division','Division'),
            strength: parseInt(requireValue('strength','Division strength')),
            department: requireValue('dept','Department')
        };
        // Derive a name from dept for compatibility with backend
        payload.name = payload.department;
        const editId = document.getElementById('class_edit_id').value;
        await postJSON(editId ? '/update_class' : '/add_class', editId ? {...payload, id: parseInt(editId)} : payload);
        resetClassForm();
        await loadAll();
    } catch (e) { showError(e); }
}
async function saveBatch(){
    try {
        const payload = {
            class_id: parseInt(requireValue('class_id','Class')),
            batch_name: requireValue('batch_name','Batch name'),
            size: parseInt(requireValue('batch_size','Batch size'))
        };
        const editId = document.getElementById('batch_edit_id').value;
        await postJSON(editId ? '/update_batch' : '/add_batch', editId ? {...payload, id: parseInt(editId)} : payload);
        resetBatchForm();
        await loadAll();
    } catch (e) { showError(e); }
}
function ensureClassDeptOption(value){
    if(!value) return;
    const sel = document.getElementById('dept');
    if([...sel.options].some(o => o.value === value)) return;
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    sel.appendChild(opt);
}
function startEditClass(id){
    const c = classCache.find(x => x.id === id);
    if(!c) return;
    document.getElementById('class_edit_id').value = c.id;
    document.getElementById('year').value = String(c.year);
    document.getElementById('division').value = c.division;
    document.getElementById('strength').value = c.strength;
    ensureClassDeptOption(c.department);
    document.getElementById('dept').value = c.department;
    /**document.getElementById('classModeBadge').textContent = 'Editing';
    document.getElementById('classModeBadge').className = 'badge text-bg-warning';**/
    window.scrollTo({top: 0, behavior: 'smooth'});
}
async function deleteClass(id){
    const c = classCache.find(x => x.id === id);
    if(!c) return;
    if(!confirm(`Delete ${c.display_name}? Related batches and timetable rows will also be removed.`)) return;
    try {
        await postJSON('/delete_class', {id});
        resetClassForm();
        await loadAll();
    } catch(e){ showError(e); }
}
function startEditBatch(id){
    const b = batchCache.find(x => x.id === id);
    if(!b) return;
    document.getElementById('batch_edit_id').value = b.id;
    document.getElementById('class_id').value = b.class_id;
    document.getElementById('batch_name').value = b.batch_name;
    document.getElementById('batch_size').value = b.size;
    /**document.getElementById('batchModeBadge').textContent = 'Editing';
    document.getElementById('batchModeBadge').className = 'badge text-bg-warning';**/
    window.scrollTo({top: 0, behavior: 'smooth'});
}
async function deleteBatch(id){
    const b = batchCache.find(x => x.id === id);
    if(!b) return;
    if(!confirm(`Delete batch ${b.batch_name}? Timetable rows for this batch will also be removed.`)) return;
    try {
        await postJSON('/delete_batch', {id});
        resetBatchForm();
        await loadAll();
    } catch(e){ showError(e); }
}

function loadClasses(){
    return fetch('/get_classes').then(r=>r.json()).then(d=>{
        classCache = d;
        document.getElementById('class_id').innerHTML = `<option value="">Select class division</option>` + d.map(c=>{
            const deptLabel = c.department ? ` ${c.department}` : '';
            return `<option value="${c.id}">${c.display_name}${deptLabel}</option>`;
        }).join('');
        document.getElementById('list').innerHTML = d.map(c=>`
            <div class="border rounded-3 p-3 mb-2">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <div class="fw-semibold">${c.display_name}</div>
                        <div class="small text-secondary">${c.department}</div>
                        <div class="small">Year: ${ROMAN[c.year] || c.year} &nbsp;|&nbsp; Strength: ${c.strength}</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-primary" onclick="startEditClass(${c.id})">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteClass(${c.id})">Delete</button>
                    </div>
                </div>
            </div>
        `).join('') || `<div class="muted">No classes added yet.</div>`;
    });
}
function loadBatches(){
    return fetch('/get_batches').then(r=>r.json()).then(d=>{
        batchCache = d;
        document.getElementById('batchList').innerHTML = d.map(b=>{
            const classLabel = `Y${ROMAN[b.year] || b.year} ${b.division || b.class_name}`;
            const deptLabel = b.department ? ` ${b.department}` : '';
            return `
            <div class="border rounded-3 p-3 mb-2">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <div class="fw-semibold">${classLabel}${deptLabel} - ${b.batch_name}</div>
                        <div class="small">Size: ${b.size}</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-primary" onclick="startEditBatch(${b.id})">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteBatch(${b.id})">Delete</button>
                    </div>
                </div>
            </div>
        `}).join('') || `<div class="muted">No batches added yet.</div>`;
    });
}
async function loadAll(){
    try {
        await loadClasses();
        await loadBatches();
    } catch (e) {
        showError(e);
    }
}
resetClassForm();
resetBatchForm();
loadAll();
</script>
{% endblock %}
