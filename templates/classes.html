{% extends "base.html" %}
{% block content %}
<h3 class="mb-1">Classes and Division Batches</h3>
<div class="muted mb-3">Create class divisions per year and then add batches for lab scheduling.</div>

<div class="row g-3">
    <div class="col-md-6">
        <div class="card-box">
            <h5>Add Class Division</h5>
            <input id="name" class="form-control mb-2" placeholder="Label (e.g. CSE)">
            <input id="year" type="number" min="1" max="4" class="form-control mb-2" placeholder="Year (1-4)">
            <input id="division" class="form-control mb-2" placeholder="Division (A/B/C)">
            <input id="strength" type="number" class="form-control mb-2" value="60" placeholder="Division strength">
            <input id="dept" class="form-control mb-2" placeholder="Department">
            <button class="btn btn-primary w-100" onclick="addClass()">Add Class</button>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card-box">
            <h5>Add Batch</h5>
            <select id="class_id" class="form-select mb-2"></select>
            <input id="batch_name" class="form-control mb-2" placeholder="Batch name (B1/B2/Alpha)">
            <input id="batch_size" type="number" class="form-control mb-2" value="30" placeholder="Batch size">
            <button class="btn btn-outline-primary w-100" onclick="addBatch()">Add Batch</button>
        </div>
    </div>
</div>

<div id="list" class="mt-3"></div>
<div id="batchList" class="mt-3"></div>

<script>
function addClass(){
fetch('/add_class',{
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({
name: document.getElementById("name").value,
year: parseInt(document.getElementById("year").value),
division: document.getElementById("division").value,
strength: parseInt(document.getElementById("strength").value || "60"),
department: document.getElementById("dept").value
})
}).then(()=>loadAll());
}

function addBatch(){
fetch('/add_batch',{
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({
class_id: parseInt(document.getElementById("class_id").value),
batch_name: document.getElementById("batch_name").value,
size: parseInt(document.getElementById("batch_size").value || "30")
})
}).then(()=>loadAll());
}

function load(){
fetch('/get_classes')
.then(r=>r.json())
.then(d=>{
class_id.innerHTML = d.map(c=>`<option value="${c.id}">${c.display_name}</option>`).join("");
list.innerHTML=d.map(c=>`
<div class="card-box mt-2">
<b>${c.display_name}</b> - ${c.department}<br>
Strength: ${c.strength}
</div>`).join("");
});
}

function loadBatches(){
fetch('/get_batches')
.then(r=>r.json())
.then(d=>{
batchList.innerHTML = d.map(b=>`
<div class="card-box mt-2">
Y${b.year} ${b.division || b.class_name} - Batch <b>${b.batch_name}</b> (size ${b.size})
</div>`).join("");
});
}

function loadAll(){ load(); loadBatches(); }
loadAll();
</script>

{% endblock %}
