<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --panel: #ffffff;
            --text: #111827;
            --muted: #64748b;
            --brand: #4f46e5;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 10% 10%, #7c8cff 0%, #5c57f0 45%, #6d28d9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
            padding: 16px;
        }
        .login-wrap {
            width: 100%;
            max-width: 420px;
        }
        .brand {
            text-align: center;
            color: #fff;
            font-weight: 700;
            margin-bottom: 14px;
            font-size: 28px;
        }
        .sub {
            text-align: center;
            color: #e0e7ff;
            margin-bottom: 18px;
        }
        .card {
            width: 100%;
            background: var(--panel);
            border: 1px solid #e2e8f0;
            padding: 26px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(17, 24, 39, 0.25);
        }
        .card h4 {
            color: var(--text);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .hint {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 14px;
        }
        .btn-login {
            background: #111827;
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .btn-login:hover { background: #0b1221; }
        .creds {
            margin-top: 10px;
            color: var(--muted);
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-wrap">
    <div class="brand">AI Timetable Generator</div>
    <div class="sub">Secure access to scheduling dashboard</div>
    <div class="card">
    <h4 class="text-center">Smart Timetable</h4>
    <div class="hint text-center">Sign in to continue</div>

    <input id="username" class="form-control mb-2" placeholder="Username" value="admin">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password" value="admin">

    <button class="btn btn-login w-100" onclick="login()">Login</button>

    <div id="msg" class="text-danger mt-2"></div>
    <div class="creds text-center">Default: admin / admin</div>
    </div>
</div>

<script>
function login(){
    fetch('/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            u: username.value,
            p: password.value
        })
    })
    .then(res=>res.json())
    .then(d=>{
        if(d.success){
            window.location='/dashboard';
        } else {
            msg.innerText="Invalid login";
        }
    });
}
password.addEventListener("keydown", (e)=>{ if(e.key === "Enter") login(); });
</script>

</body>
</html>
