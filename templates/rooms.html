{% extends "base.html" %}
{% block title %}rooms — ai timetable{% endblock %}

{% block content %}
<div class="section-header reveal-up">
    <h3>room management</h3>
    <div class="section-desc">room capacities are enforced for both theory classrooms and labs</div>
</div>

<!-- Room Form -->
<div class="panel mb-lg reveal-up">
    <div class="panel-header">
        <div class="panel-title">room</div>
    </div>
    <input type="hidden" id="room_edit_id">

    <div class="form-row form-row-3 mb-lg">
        <div class="form-group">
            <label class="form-label" for="name">room name</label>
            <input id="name" class="form-input" placeholder="e.g. Room 301">
        </div>
        <div class="form-group">
            <label class="form-label" for="type">room type</label>
            <select id="type" class="form-select form-input">
                <option>Classroom</option>
                <option>Lab</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="capacity">capacity</label>
            <input id="capacity" type="number" min="1" class="form-input" value="60">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-gold" onclick="saveRoom()">save room</button>
        <button class="btn" onclick="resetRoomForm()">clear</button>
    </div>
</div>

<!-- Room List -->
<div class="panel reveal-up">
    <div class="panel-header">
        <div class="panel-title">rooms</div>
    </div>
    <div id="list"></div>
</div>

<script>
let roomCache = [];
function reqv(id, label){ const v=(document.getElementById(id).value||'').trim(); if(!v) throw new Error(label+' is required.'); return v; }
function resetRoomForm(){
    document.getElementById('room_edit_id').value='';
    document.getElementById('name').value='';
    document.getElementById('type').value='Classroom';
    document.getElementById('capacity').value='60';
}
async function saveRoom(){
    try {
        const payload = {
            name: reqv('name','Room name'),
            type: reqv('type','Room type'),
            capacity: parseInt(reqv('capacity','Capacity'))
        };
        const editId = document.getElementById('room_edit_id').value;
        const res = await fetch(editId ? '/update_room' : '/add_room', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(editId ? {...payload, id: parseInt(editId)} : payload)
        });
        const data = await res.json().catch(()=>({}));
        if(!res.ok || data.status === 'error') throw new Error(data.message || data.error || 'Unable to save room');
        resetRoomForm();
        loadRooms();
    } catch(e){ alert(e.message || e); }
}
function startEditRoom(id){
    const r = roomCache.find(x=>x.id===id);
    if(!r) return;
    document.getElementById('room_edit_id').value=r.id;
    document.getElementById('name').value=r.name;
    document.getElementById('type').value=r.type;
    document.getElementById('capacity').value=r.capacity;
    window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteRoom(id){
    const r = roomCache.find(x=>x.id===id);
    if(!r) return;
    if(!confirm(`Delete ${r.name}? Timetable rows using this room will also be removed.`)) return;
    try {
        const res = await fetch('/delete_room', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
        const data = await res.json().catch(()=>({}));
        if(!res.ok || data.status === 'error') throw new Error(data.message || data.error || 'Unable to delete room');
        resetRoomForm();
        loadRooms();
    } catch(e){ alert(e.message || e); }
}
function loadRooms(){
    fetch('/get_rooms').then(res=>res.json()).then(data=>{
        roomCache = data;
        if (!data.length) {
            document.getElementById('list').innerHTML = '<div class="empty-state">no rooms added yet — create your first entry above</div>';
            return;
        }
        document.getElementById('list').innerHTML = data.map(r=>`
            <div class="list-item">
                <div>
                    <div class="item-name">${r.name}</div>
                    <div class="item-meta">${r.type} · capacity: ${r.capacity}</div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-sm" onclick="startEditRoom(${r.id})">edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteRoom(${r.id})">delete</button>
                </div>
            </div>
        `).join('');
    });
}
resetRoomForm();
loadRooms();
</script>
{% endblock %}
