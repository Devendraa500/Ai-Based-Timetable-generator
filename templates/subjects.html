{% extends "base.html" %}
{% block title %}subjects — ai timetable{% endblock %}

{% block content %}
<div class="section-header reveal-up">
    <h3>subject management</h3>
    <div class="section-desc">theory is fixed to 1 hour and labs are fixed to 2 continuous hours</div>
</div>

<!-- Subject Form -->
<div class="panel mb-lg reveal-up">
    <div class="panel-header">
        <div class="panel-title">subject</div>
    </div>
    <input type="hidden" id="subject_edit_id">

    <div class="form-row form-row-2 mb-md">
        <div class="form-group">
            <label class="form-label" for="name">subject name</label>
            <input id="name" class="form-input" placeholder="e.g. Data Structures">
        </div>
        <div class="form-group">
            <label class="form-label" for="code">subject code</label>
            <input id="code" class="form-input" placeholder="e.g. CS301">
        </div>
    </div>

    <div class="form-row form-row-4 mb-md">
        <div class="form-group">
            <label class="form-label" for="year">year</label>
            <select id="year" class="form-select form-input">
                <option value="1">1st year</option>
                <option value="2">2nd year</option>
                <option value="3">3rd year</option>
                <option value="4">4th year</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="type">type</label>
            <select id="type" class="form-select form-input" onchange="syncDuration()">
                <option>Theory</option>
                <option>Lab</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="weekly">sessions / week</label>
            <input id="weekly" type="number" min="1" class="form-input" value="3">
        </div>
        <div class="form-group">
            <label class="form-label" for="continuous_slots">continuous slots</label>
            <input id="continuous_slots" type="number" class="form-input" value="1" readonly style="opacity:0.6">
        </div>
    </div>

    <div class="form-group mb-md">
        <label class="form-label" for="faculty">faculty</label>
        <select id="faculty" class="form-select form-input"></select>
    </div>

    <div class="text-xs text-muted mb-lg" id="durationHint">theory lectures are always 1 hour.</div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="saveSubject()">save subject</button>
        <button class="btn" onclick="resetSubjectForm()">clear</button>
    </div>
</div>

<!-- Subject List -->
<div class="panel reveal-up">
    <div class="panel-header">
        <div class="panel-title">subjects</div>
    </div>
    <div id="list"></div>
</div>

<script>
let subjectCache = [];
let facultyList = [];
function syncDuration(){
    const isLab = document.getElementById('type').value === 'Lab';
    document.getElementById('continuous_slots').value = isLab ? '2' : '1';
    document.getElementById('durationHint').textContent = isLab ? 'labs are fixed to 2 continuous hours.' : 'theory lectures are always 1 hour.';
}
function req(id, label){ const v=(document.getElementById(id).value||'').trim(); if(!v) throw new Error(label+' is required.'); return v; }
function resetSubjectForm(){
    document.getElementById('subject_edit_id').value='';
    document.getElementById('name').value='';
    document.getElementById('code').value='';
    document.getElementById('year').value='1';
    document.getElementById('type').value='Theory';
    document.getElementById('weekly').value='3';
    syncDuration();
    document.getElementById('faculty').value='';
}
function loadFaculty(){
    return fetch('/get_faculty').then(res=>res.json()).then(data=>{
        facultyList = data;
        document.getElementById('faculty').innerHTML = `<option value="">select faculty</option>` + data.map(f=>`<option value="${f.name}">${f.name}</option>`).join('');
    });
}
async function saveSubject(){
    try {
        const payload = {
            name: req('name','Subject name'),
            code: req('code','Subject code'),
            year: parseInt(req('year','Year')),
            type: req('type','Type'),
            weekly: parseInt(req('weekly','Sessions per week')),
            continuous_slots: parseInt(req('continuous_slots','Continuous slots')),
            faculty: req('faculty','Faculty'),
            priority: 'Medium'
        };
        const editId = document.getElementById('subject_edit_id').value;
        const res = await fetch(editId ? '/update_subject' : '/add_subject', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(editId ? {...payload, id: parseInt(editId)} : payload)
        });
        const data = await res.json().catch(()=>({}));
        if(!res.ok || data.status === 'error') throw new Error(data.message || data.error || 'Unable to save subject');
        resetSubjectForm();
        loadSubjects();
    } catch(e){ alert(e.message || e); }
}
function startEditSubject(id){
    const s = subjectCache.find(x=>x.id===id);
    if(!s) return;
    document.getElementById('subject_edit_id').value = s.id;
    document.getElementById('name').value = s.name;
    document.getElementById('code').value = s.code;
    document.getElementById('year').value = s.year;
    document.getElementById('type').value = s.type;
    document.getElementById('weekly').value = s.weekly_sessions;
    syncDuration();
    document.getElementById('faculty').value = s.faculty;
    window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteSubject(id){
    const s = subjectCache.find(x=>x.id===id);
    if(!s) return;
    if(!confirm(`Delete ${s.name}? Matching timetable rows for year ${s.year} will also be removed.`)) return;
    try {
        const res = await fetch('/delete_subject', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
        const data = await res.json().catch(()=>({}));
        if(!res.ok || data.status === 'error') throw new Error(data.message || data.error || 'Unable to delete subject');
        resetSubjectForm();
        loadSubjects();
    } catch(e){ alert(e.message || e); }
}
function loadSubjects(){
    fetch('/get_subjects').then(res=>res.json()).then(data=>{
        subjectCache = data;
        if (!data.length) {
            document.getElementById('list').innerHTML = '<div class="empty-state">no subjects added yet — create your first entry above</div>';
            return;
        }
        document.getElementById('list').innerHTML = data.map(s=>`
            <div class="list-item">
                <div>
                    <div class="item-name">Y${s.year} — ${s.name}</div>
                    <div class="item-meta">${s.code} · ${s.type} · faculty: ${s.faculty} · weekly: ${s.weekly_sessions} · slots: ${s.continuous_slots}</div>
                </div>
                <div class="item-actions">
                    <button class="btn btn-sm" onclick="startEditSubject(${s.id})">edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteSubject(${s.id})">delete</button>
                </div>
            </div>
        `).join('');
    });
}
Promise.all([loadFaculty()]).then(()=>{ resetSubjectForm(); loadSubjects(); });
</script>
{% endblock %}
