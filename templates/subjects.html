{% extends "base.html" %}
{% block content %}
<h3 class="mb-1">Subject Management</h3>
<div class="muted mb-3">Map subjects to a specific year with weekly frequency and continuous slot duration.</div>

<div class="card-box">
    <input id="name" class="form-control mb-2" placeholder="Subject name">
    <input id="code" class="form-control mb-2" placeholder="Code">
    <div class="row g-2 mb-2">
        <div class="col-md-4">
            <select id="year" class="form-select">
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>
        <div class="col-md-4">
            <select id="type" class="form-select">
                <option>Theory</option>
                <option>Lab</option>
            </select>
        </div>
        <div class="col-md-4">
            <select id="faculty" class="form-select"></select>
        </div>
    </div>
    <div class="row g-2 mb-2">
        <div class="col-md-6"><input id="weekly" type="number" class="form-control" value="3" placeholder="Sessions per week"></div>
        <div class="col-md-6"><input id="continuous_slots" type="number" class="form-control" value="1" placeholder="Continuous slots"></div>
    </div>
    <button class="btn btn-success" onclick="addSubject()">Add Subject</button>
</div>

<div id="list" class="mt-3"></div>

<script>
function loadFaculty(){
fetch('/get_faculty')
.then(res=>res.json())
.then(data=>{
faculty.innerHTML=data.map(f=>`<option>${f.name}</option>`).join("");
});
}

function addSubject(){
fetch('/add_subject',{
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({
name: document.getElementById("name").value,
code: document.getElementById("code").value,
year: parseInt(document.getElementById("year").value),
type: document.getElementById("type").value,
weekly: parseInt(document.getElementById("weekly").value || "1"),
continuous_slots: parseInt(document.getElementById("continuous_slots").value || "1"),
priority: "Medium",
faculty: document.getElementById("faculty").value
})
}).then(()=>loadSubjects());
}

function loadSubjects(){
fetch('/get_subjects')
.then(res=>res.json())
.then(data=>{
list.innerHTML=data.map(s=>`
<div class="card-box mt-2">
<b>Y${s.year} - ${s.name}</b> (${s.code}) | ${s.type}<br>
Faculty: ${s.faculty} | Weekly: ${s.weekly_sessions} | Continuous slots: ${s.continuous_slots}
</div>`).join("");
});
}

loadFaculty();
loadSubjects();
</script>
{% endblock %}
